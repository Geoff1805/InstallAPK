name: Android CI & Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Prepare Signing Keystore
        run: |
          mkdir -p app
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > app/debug.keystore
            echo "Keystore restauré depuis debug.keystore.base64"
          elif [ ! -f app/debug.keystore ]; then
            echo "Génération automatique du keystore de signature..."
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la app/debug.keystore

      - name: Build Release and Debug APKs
        run: |
          ./gradlew assembleRelease assembleDebug

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: installapk-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: installapk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

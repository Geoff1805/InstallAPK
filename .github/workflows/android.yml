name: Android CI & Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Prepare Signing Keystore
        run: |
          mkdir -p app
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > app/debug.keystore
            echo "Keystore restauré depuis debug.keystore.base64"
          elif [ ! -f app/debug.keystore ]; then
            echo "Génération automatique du keystore de signature..."
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la app/debug.keystore

      - name: Build Release and Debug APKs
        run: |
          ./gradlew assembleRelease assembleDebug

      - name: Prepare Normalized APK
        run: |
          mkdir -p build-artifacts
          VERSION=$(grep 'versionName' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          APK_NAME="InstallAPK-v${VERSION}.apk"
          RELEASE_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "build-artifacts/${APK_NAME}"
            echo "Copied Release APK to build-artifacts/${APK_NAME}"
          else
            DEBUG_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
            cp "$DEBUG_APK" "build-artifacts/${APK_NAME}"
            echo "Copied Debug APK to build-artifacts/${APK_NAME}"
          fi
          # Copie de compatibilité legacy sans version
          cp "build-artifacts/${APK_NAME}" build-artifacts/InstallAPK.apk
          ls -lh build-artifacts/

      - name: Upload Normalized APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstallAPK-v${{ env.APK_VERSION || 'latest' }}.apk
          path: build-artifacts/InstallAPK-v*.apk
          retention-days: 3

      - name: Publish Direct Unzipped APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep 'versionName' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          TAG="v${VERSION}"
          APK_NAME="InstallAPK-v${VERSION}.apk"
          echo "Publishing direct ${APK_NAME} for tag $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build-artifacts/${APK_NAME}" build-artifacts/InstallAPK.apk --clobber
          else
            gh release create "$TAG" "build-artifacts/${APK_NAME}" build-artifacts/InstallAPK.apk \
              --title "InstallAPK v${VERSION}" \
              --notes "Version ${VERSION} compilée automatiquement par GitHub Actions. Binaire APK direct avec nom normalisé InstallAPK-v${VERSION}.apk sans archive zip."
          fi

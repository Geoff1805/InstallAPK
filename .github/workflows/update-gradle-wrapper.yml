name: Update Gradle Wrapper (Stable)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-gradle-wrapper:
    name: Check & Update Gradle Wrapper (Stable)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Check and Update Gradle Wrapper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Récupération de la dernière version stable officielle de Gradle
          RELEASE_INFO=$(curl -sSL https://services.gradle.org/versions/current)
          LATEST_VERSION=$(echo "$RELEASE_INFO" | jq -r '.version')
          CHECKSUM=$(echo "$RELEASE_INFO" | jq -r '.checksum')

          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
            echo "::error::Impossible de récupérer la dernière version stable de Gradle."
            exit 1
          fi

          # 2. Récupération de la version actuelle déclarée dans gradle-wrapper.properties
          CURRENT_VERSION=$(grep 'distributionUrl' gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')
          echo "Version actuelle : $CURRENT_VERSION"
          echo "Dernière version stable : $LATEST_VERSION"

          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "Le Gradle Wrapper est déjà à jour (version $CURRENT_VERSION)."
            exit 0
          fi

          echo "Mise à niveau du Gradle Wrapper vers la version $LATEST_VERSION..."
          ./gradlew wrapper --gradle-version "$LATEST_VERSION" --distribution-type bin --gradle-distribution-sha256-sum "$CHECKSUM"
          ./gradlew wrapper --gradle-version "$LATEST_VERSION"

          # 3. Vérification des changements générés
          if git diff --quiet gradle/wrapper/ gradlew gradlew.bat; then
            echo "Aucun changement détecté."
            exit 0
          fi

          BRANCH="chore/update-gradle-wrapper-$LATEST_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "La branche $BRANCH existe déjà sur le dépôt distant."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add gradle/wrapper/ gradlew gradlew.bat
          git commit -m "chore(deps): update Gradle Wrapper to $LATEST_VERSION"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore(deps): bump Gradle Wrapper to $LATEST_VERSION" \
            --body "Mise à jour automatique du Gradle Wrapper vers la dernière version stable (GA) **$LATEST_VERSION**." \
            --head "$BRANCH" \
            --base "main" \
            --label "dependencies,gradle"
